<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self';" />
  <title>CodeMyLife - Bloqueo diario</title>
  <link rel="stylesheet" href="daily-focus-lock.css" />
</head>
<body>
  <main class="focus-lock" aria-live="polite">
    <p id="focus-mode-label" class="focus-eyebrow">CodeMyLife · Bloqueo diario</p>
    <h1 id="focus-title">Bloqueo diario activo</h1>
    <p class="focus-subtitle">Mañana: 08:00–15:00 · tarde: 18:00–22:00</p>
    <p id="focus-note" class="focus-note">Solo puedes usar los controles de esta pantalla hasta completar tus tareas.</p>
    <div class="lock-updater" style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
      <button id="check-updates" type="button" style="padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;">Comprobar actualización</button>
      <div id="update-status" style="font-size: 12px; color: rgba(255,255,255,0.8); min-height: 18px;">Sin comprobación</div>
    </div>
    <button id="pause-daily-focus" class="pause-focus-button" type="button">Pausa temporal · 60 segundos</button>
    <div id="pause-focus-status" class="pause-focus-status" aria-live="polite"></div>
    <ul class="focus-list" id="focus-list"></ul>
  </main>
  <script src="daily-focus-lock.js"></script>
</body>
</html>
