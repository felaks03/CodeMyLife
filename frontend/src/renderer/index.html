<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>CodeMyLife</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="banner" class="banner hidden" role="status" aria-live="polite">
    <span id="banner-message"></span>
    <button id="banner-close" class="banner-close" type="button" aria-label="Cerrar aviso">×</button>
  </div>
  <span id="app-version" class="app-version" aria-label="Version de la aplicacion"></span>

  <section id="app-view" class="view">
    <p id="guest-banner" class="info-banner hidden" data-i18n="guestBanner"></p>
    <header class="topbar">
      <div>
        <strong id="user-name"></strong>
      </div>
      <button id="skip-daily-focus" class="skip-daily-focus hidden" type="button">Saltar bloqueo diario (desarrollo)</button>
    </header>
    <section id="active-locks" class="active-locks hidden" aria-live="polite">
      <div class="active-locks-heading">
        <span class="live-indicator"></span>
        <strong data-i18n="activeLocksTitle"></strong>
      </div>
      <div id="active-lock-list"></div>
    </section>

    <div id="tab-profile" class="tab-content">
      <div class="profile-layout">
        <div class="profile-main">
          <div class="card profile-card">
            <div class="profile-header">
              <div id="profile-avatar" class="profile-avatar">P</div>
              <div class="profile-info">
                <h3 id="profile-name">Perfil</h3>
                <p id="profile-email"></p>
              </div>
            </div>
          </div>

          <div class="card profile-card">
            <div class="scripts-page-heading">
              <div>
                <p class="eyebrow">CodeMyLife</p>
                <h2 data-i18n="profileScriptsTitle"></h2>
              </div>
              <div class="action-group">
                <button id="lock-week" class="lock-week" type="button" data-i18n="lockWeek" aria-describedby="lock-week-hint"></button>
                <p id="lock-week-hint" class="action-hint" data-i18n="lockWeekHint"></p>
              </div>
            </div>
            <div id="script-browser" class="scripts-browser-card">
              <ul id="script-results" class="list scripts"></ul>
            </div>
          </div>

        </div>

        <aside class="profile-sidebar">
          <section class="card economy-card wallet-card">
            <div class="wallet-balance">
              <img class="coin-art coin-art-small" src="../../assets/coin.svg" alt="" />
              <div>
                <p class="wallet-label">Saldo disponible</p>
                <strong id="coin-balance" class="coin-balance">0</strong>
              </div>
              <span class="wallet-status">LISTO</span>
            </div>
          </section>
          <section class="card economy-card inventory-card">
            <div class="inventory-heading">
              <div>
                <p class="eyebrow">Inventario</p>
                <h2>Mis objetos</h2>
              </div>
              <strong id="inventory-count" class="inventory-count">0 disponibles</strong>
            </div>
            <div id="inventory-list" class="inventory-list"></div>
          </section>
          <section class="card economy-card shop-card">
            <div class="shop-heading">
              <div>
                <p class="eyebrow">Recompensas</p>
                <h2 data-i18n="shopTitle"></h2>
                <p class="shop-subtitle">Canjea tus monedas por tiempo desbloqueado.</p>
              </div>
            </div>
            <div id="shop-list" class="economy-list"></div>
          </section>
        </aside>
      </div>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
