<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>CodeMyLife</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

  <section id="app-view" class="view">
    <p id="guest-banner" class="info-banner hidden" data-i18n="guestBanner"></p>
    <header class="topbar">
      <div>
        <strong id="user-name"></strong>
      </div>
    </header>
    <section id="active-locks" class="active-locks hidden" aria-live="polite">
      <div class="active-locks-heading">
        <span class="live-indicator"></span>
        <strong data-i18n="activeLocksTitle"></strong>
      </div>
      <div id="active-lock-list"></div>
    </section>

    <div id="tab-profile" class="tab-content">
      <div class="profile-layout">
        <div class="profile-main">
          <div class="card profile-card">
            <div class="profile-header">
              <div id="profile-avatar" class="profile-avatar">P</div>
              <div class="profile-info">
                <h3 id="profile-name">Perfil</h3>
                <p id="profile-email"></p>
                <p id="profile-stats-summary"></p>
              </div>
            </div>
          </div>

          <div class="card profile-card">
            <div class="scripts-page-heading">
              <div>
                <p class="eyebrow">CodeMyLife</p>
                <h2 data-i18n="profileScriptsTitle"></h2>
              </div>
              <div class="action-group">
                <button id="lock-week" class="lock-week" type="button" data-i18n="lockWeek" aria-describedby="lock-week-hint"></button>
                <p id="lock-week-hint" class="action-hint" data-i18n="lockWeekHint"></p>
                <button id="test-lock" class="test-lock" type="button" data-i18n="testLock" aria-describedby="test-lock-hint"></button>
                <p id="test-lock-hint" class="action-hint" data-i18n="testLockHint"></p>
                <button id="sleep-lock-test" class="sleep-lock-test" type="button" data-i18n="sleepLockTest"></button>
                <p class="action-hint" data-i18n="sleepLockTestHint"></p>
              </div>
            </div>
            <div id="script-browser" class="scripts-browser-card">
              <ul id="script-results" class="list scripts"></ul>
            </div>
          </div>

        </div>

        <aside class="profile-sidebar">
          <h2 data-i18n="myCommitments"></h2>
          <div id="stats" class="stats"></div>
          <p class="calendar-title" data-i18n="activity"></p>
          <div id="calendar" class="calendar"></div>
          <ul id="commitments" class="list"></ul>
        </aside>
      </div>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
