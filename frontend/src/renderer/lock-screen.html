<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';" />
  <title>CodeMyLife - Descanso</title>
  <link rel="stylesheet" href="lock-screen.css" />
</head>
<body>
  <main class="sleep-lock" aria-live="polite">
    <div class="sleep-lock-mark">CodeMyLife</div>
    <p class="sleep-lock-eyebrow">Bloqueo de dormir</p>
    <h1>Es hora de descansar</h1>
    <p class="sleep-lock-copy">El ordenador volvera a estar disponible automaticamente.</p>
    <div id="sleep-countdown" class="sleep-countdown" aria-live="polite" aria-label="Tiempo restante">08:00:00</div>
    <p class="sleep-lock-status">Pantalla bloqueada · regreso automatico</p>
    <div class="lock-updater" style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
      <button id="check-updates" type="button" style="padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;">Comprobar actualización</button>
      <div id="update-status" style="font-size: 12px; color: rgba(255,255,255,0.8); min-height: 18px;">Sin comprobación</div>
    </div>
  </main>
  <script src="lock-screen.js"></script>
</body>
</html>
