name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --loglevel=error
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Package Windows release
        working-directory: frontend
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify updater assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/dist_electron -Filter 'CodeMyLife Setup *.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Missing NSIS installer exe.' }
          if (-not (Test-Path 'frontend/dist_electron/latest.yml')) { throw 'Missing latest.yml.' }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'Missing installer blockmap.' }
      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist_electron/CodeMyLife Setup *.exe
            frontend/dist_electron/CodeMyLife Setup *.exe.blockmap
            frontend/dist_electron/latest.yml